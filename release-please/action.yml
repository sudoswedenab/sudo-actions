name: release-please
description: Run release-please in manifest mode
inputs:
  command:
    description: release-please command
    required: false
    default: manifest
  config-file:
    description: Optional path to release-please config file in the caller repository
    required: false
    default: ""
  manifest-file:
    description: Path to release-please manifest file
    required: false
    default: .release-please-manifest.json
runs:
  using: composite
  steps:
    - id: resolve-config-file
      shell: bash
      run: |
        if [[ -n "${{ inputs.config-file }}" ]]; then
          echo "config-file=${{ inputs.config-file }}" >> "$GITHUB_OUTPUT"
        else
          echo "config-file=${{ github.action_path }}/config.json" >> "$GITHUB_OUTPUT"
        fi
    - uses: googleapis/release-please-action@v4
      with:
        command: ${{ inputs.command }}
        config-file: ${{ steps.resolve-config-file.outputs.config-file }}
        manifest-file: ${{ inputs.manifest-file }}
