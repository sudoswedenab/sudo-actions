name: release-please
description: Run release-please in manifest mode
inputs:
  command:
    description: release-please command
    required: false
    default: manifest
  config-file:
    description: Path to release-please config file in the caller repository
    required: false
    default: .release-please-config.json
  manifest-file:
    description: Path to release-please manifest file
    required: false
    default: .release-please-manifest.json
outputs:
  release_created:
    description: True when a root release was created
    value: ${{ steps.release.outputs.release_created }}
  tag_name:
    description: Created root release tag name
    value: ${{ steps.release.outputs.tag_name }}
  version:
    description: Created root release version
    value: ${{ steps.release.outputs.version }}
runs:
  using: composite
  steps:
    - id: release
      uses: googleapis/release-please-action@v4
      with:
        command: ${{ inputs.command }}
        config-file: ${{ inputs.config-file }}
        manifest-file: ${{ inputs.manifest-file }}
