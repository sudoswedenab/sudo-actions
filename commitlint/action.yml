name: commitlint
description: Lint pull request commit messages using Conventional Commits
inputs:
  node-version:
    description: Node.js version for running commitlint
    required: false
    default: "22"
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4.2.2
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v4.4.0
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false
    - shell: bash
      run: |
        npx --yes --package @commitlint/cli --package @commitlint/config-conventional \
          commitlint --extends @commitlint/config-conventional \
          --from "${{ github.event.pull_request.base.sha }}" \
          --to "${{ github.event.pull_request.head.sha }}" --verbose
